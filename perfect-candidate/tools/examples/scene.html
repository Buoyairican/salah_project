<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; src: url('../../app/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Mono'; src: url('../../app/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * Draws one frame of an example clip (or an example speaker photo) at time t, deterministically, so the renderer
 * can step through time. A placeholder on purpose: a lit silhouette in a softly blurred room, never a face.
 */
const cv = document.getElementById('c')
const g = cv.getContext('2d')
let P = null

function rng(seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

window.setup = async (params) => {
  P = params
  cv.width = P.w
  cv.height = P.h
  const r = rng(P.hue * 7 + 3)
  P.bokeh = Array.from({ length: P.mode === 'photo' ? 9 : 22 }, () => ({
    x: r(), y: r() * 0.8, rad: 0.03 + r() * 0.11, a: 0.05 + r() * 0.16,
    warm: r() < 0.55, sp: 0.004 + r() * 0.012, ph: r() * 6.28,
  }))
  await document.fonts.load('600 20px Inter')
  await document.fonts.load('500 20px Mono')
}

function env(t) {
  if (!P.env || !P.env.length) return 0
  const i = t * 30
  const a = P.env[Math.max(0, Math.min(P.env.length - 1, Math.floor(i)))]
  const b = P.env[Math.max(0, Math.min(P.env.length - 1, Math.floor(i) + 1))]
  return a + (b - a) * (i - Math.floor(i))
}
function smoothEnv(t) {
  let s = 0, n = 0
  for (let k = -3; k <= 3; k++) { s += env(t + k / 30); n++ }
  return s / n
}

function room(t) {
  const { w, h, hue } = P
  const bg = g.createLinearGradient(0, 0, w * 0.4, h)
  bg.addColorStop(0, `hsl(${hue} 28% 17%)`)
  bg.addColorStop(1, `hsl(${hue + 25} 32% 6%)`)
  g.fillStyle = bg
  g.fillRect(0, 0, w, h)
  // a big soft window glow, upper left
  const win = g.createRadialGradient(w * 0.18, h * 0.12, 0, w * 0.18, h * 0.12, Math.max(w, h) * 0.75)
  win.addColorStop(0, `hsla(${hue + 30} 60% 70% / 0.22)`)
  win.addColorStop(1, 'hsla(0 0% 0% / 0)')
  g.fillStyle = win
  g.fillRect(0, 0, w, h)
  // bokeh: out-of-focus lights drifting slowly
  const m = Math.max(w, h)
  for (const b of P.bokeh) {
    const x = (b.x + Math.sin(t * b.sp * 6 + b.ph) * 0.02) * w
    const y = (b.y + Math.cos(t * b.sp * 5 + b.ph) * 0.015) * h
    const rad = b.rad * m
    const grd = g.createRadialGradient(x, y, 0, x, y, rad)
    const col = b.warm ? `hsla(${hue + 35} 90% 72%` : `hsla(${hue - 20} 70% 70%`
    grd.addColorStop(0, `${col} / ${b.a})`)
    grd.addColorStop(0.65, `${col} / ${b.a * 0.55})`)
    grd.addColorStop(1, `${col} / 0)`)
    g.fillStyle = grd
    g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill()
  }
}

function person(t, e) {
  const { w, h, hue } = P
  const s = P.mode === 'photo' ? Math.min(w, h) * 0.9 : (P.orientation === 'portrait' ? w * 0.95 : h * 0.98)
  const cx = w / 2 + (P.mode === 'photo' ? 0 : Math.sin(t * 0.37) * s * 0.006)
  const base = P.mode === 'photo' ? h * 1.02 : h * (P.orientation === 'portrait' ? 0.86 : 1.03)
  const breathe = 1 + Math.sin(t * 1.4) * 0.004
  const nod = P.mode === 'photo' ? 0 : (e - 0.4) * 0.012 * s
  const headR = s * 0.165
  const headY = base - s * 0.62 + nod
  // glow behind the head while speaking
  if (P.mode !== 'photo') {
    const gl = g.createRadialGradient(cx, headY, headR * 0.6, cx, headY, headR * 3.2)
    gl.addColorStop(0, `hsla(${hue + 30} 80% 70% / ${0.07 + e * 0.16})`)
    gl.addColorStop(1, 'hsla(0 0% 0% / 0)')
    g.fillStyle = gl
    g.fillRect(0, 0, w, h)
  }
  const body = g.createLinearGradient(cx - s * 0.5, base - s * 0.5, cx + s * 0.4, base)
  body.addColorStop(0, `hsl(${hue + 10} 18% 30%)`)
  body.addColorStop(1, `hsl(${hue + 10} 22% 12%)`)
  g.save()
  g.translate(cx, base)
  g.scale(1, breathe)
  g.translate(-cx, -base)
  // shoulders
  g.fillStyle = body
  g.beginPath()
  const sw = s * 0.46, top = base - s * 0.34
  const floor = h + 10
  g.moveTo(cx - sw * 1.04, floor)
  g.lineTo(cx - sw, base)
  g.bezierCurveTo(cx - sw, top + s * 0.02, cx - sw * 0.62, top - s * 0.02, cx - s * 0.12, top - s * 0.05)
  // the neck rises out of the shoulders
  g.bezierCurveTo(cx - s * 0.07, top - s * 0.07, cx - s * 0.065, headY + headR * 0.9, cx - s * 0.06, headY + headR * 0.6)
  g.lineTo(cx + s * 0.06, headY + headR * 0.6)
  g.bezierCurveTo(cx + s * 0.065, headY + headR * 0.9, cx + s * 0.07, top - s * 0.07, cx + s * 0.12, top - s * 0.05)
  g.bezierCurveTo(cx + sw * 0.62, top - s * 0.02, cx + sw, top + s * 0.02, cx + sw, base)
  g.lineTo(cx + sw * 1.04, floor)
  g.closePath()
  g.fill()
  g.restore()
  // head
  const hd = g.createRadialGradient(cx + headR * 0.45, headY - headR * 0.5, headR * 0.1, cx, headY, headR * 1.15)
  hd.addColorStop(0, `hsl(${hue + 20} 22% 40%)`)
  hd.addColorStop(1, `hsl(${hue + 10} 20% 18%)`)
  g.fillStyle = hd
  g.beginPath(); g.ellipse(cx, headY, headR * 0.86, headR, 0, 0, Math.PI * 2); g.fill()
  // rim light on the window side
  g.save()
  g.filter = `blur(${Math.max(2, s * 0.008)}px)`
  g.strokeStyle = `hsla(${hue + 35} 80% 82% / 0.28)`
  g.lineWidth = Math.max(3, s * 0.012)
  g.beginPath(); g.ellipse(cx - s * 0.004, headY + s * 0.004, headR * 0.84, headR * 0.98, 0, -1.9, -0.25); g.stroke()
  g.restore()
}

function grain(t) {
  const { w, h } = P
  const r = rng(Math.floor(t * 25) + 11)
  g.fillStyle = 'rgba(255,255,255,0.022)'
  for (let k = 0; k < (w * h) / 700; k++) g.fillRect(r() * w, r() * h, 1.4, 1.4)
  const v = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75)
  v.addColorStop(0, 'rgba(0,0,0,0)')
  v.addColorStop(1, 'rgba(0,0,0,0.55)')
  g.fillStyle = v
  g.fillRect(0, 0, w, h)
}

function label(t) {
  const { w, h } = P
  const u = Math.min(w, h) / 720
  const x = 28 * u, y = 28 * u
  g.font = `650 ${15 * u}px Inter`
  const txt = 'EXAMPLE CLIP'
  const tw = g.measureText(txt).width
  g.fillStyle = 'rgba(0,0,0,0.45)'
  g.beginPath(); g.roundRect(x, y, tw + 44 * u, 34 * u, 17 * u); g.fill()
  g.fillStyle = `rgba(255, 92, 92, ${0.65 + 0.35 * Math.abs(Math.sin(t * 2.2))})`
  g.beginPath(); g.arc(x + 18 * u, y + 17 * u, 5 * u, 0, Math.PI * 2); g.fill()
  g.fillStyle = 'rgba(255,255,255,0.92)'
  g.textBaseline = 'middle'
  g.fillText(txt, x + 31 * u, y + 17.5 * u)
  g.font = `500 ${14 * u}px Inter`
  g.fillStyle = 'rgba(255,255,255,0.6)'
  g.fillText('Synthetic voice · replace with the real video', x + 2 * u, y + 56 * u)
  g.font = `500 ${14 * u}px Mono`
  g.textAlign = 'right'
  const s = Math.floor(t), f = Math.floor((t - s) * 25)
  g.fillText(`00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`, w - 28 * u, y + 17 * u)
  g.textAlign = 'left'
}

window.frame = (t) => {
  const e = smoothEnv(t)
  room(t)
  person(t, e)
  grain(t)
  if (P.mode !== 'photo') label(t)
}
</script>
</body>
</html>
