00:00:00.470 --> 00:00:05.594
When a candidate walks in late without a word, the jury has already formed an opinion.

2
00:00:05.634 --> 00:00:09.324
If you know you will be late, call before the interview starts.

3
00:00:09.364 --> 00:00:13.810
When you arrive, greet everyone, apologise once, and move on.

4
00:00:13.850 --> 00:00:16.059
And never blame the traffic.
`,Gs=`WEBVTT

1
00:00:00.470 --> 00:00:03.975
When a jury member cuts you off, don’t stop.

2
00:00:04.015 --> 00:00:08.551
Stay calm, and ask politely: may I finish my sentence?

3
00:00:08.591 --> 00:00:10.607
Thirty seconds is enough.

4
00:00:10.647 --> 00:00:14.893
A good jury listens. A good candidate keeps the thread.
`,Ks=`WEBVTT

1
00:00:00.470 --> 00:00:06.224
Hardworking, motivated, team player. I hear those words ten times a day.

2
00:00:06.264 --> 00:00:08.918
Without proof, they mean nothing.

3
00:00:08.958 --> 00:00:13.039
Tell me a real situation, what you did, and the result.

4
00:00:13.079 --> 00:00:15.526
With a number, if you can.
`,qs=`WEBVTT

1
00:00:00.470 --> 00:00:04.490
In my panel interview, a juror called my answer weak.

2
00:00:04.530 --> 00:00:09.766
I wanted to argue. Instead, I asked which part worried him.

3
00:00:09.806 --> 00:00:13.340
Then I answered that exact point, with facts.

4
00:00:13.380 --> 00:00:17.116
Criticism is often a question in disguise.
`,Js=`WEBVTT

1
00:00:00.470 --> 00:00:03.455
A first impression is not evidence.

2
00:00:03.495 --> 00:00:07.941
On our jury, everyone scores alone, with a score sheet, before we discuss.

3
00:00:07.981 --> 00:00:10.919
We judge the work, not the tie.
`,Ys=`WEBVTT

1
00:00:00.470 --> 00:00:04.507
When a candidate has no questions, I wonder if they really want the job.

2
00:00:04.547 --> 00:00:07.760
Ask what success looks like after six months.

3
00:00:07.800 --> 00:00:09.945
Ask what problem the team has today.

4
00:00:09.985 --> 00:00:13.609
An interview is a conversation that goes both ways.
`,Xs=`WEBVTT

1
00:00:00.470 --> 00:00:03.014
Three minutes to decide is too short.

2
00:00:03.054 --> 00:00:06.118
Before you say no, read the candidate’s file again.

3
00:00:06.158 --> 00:00:09.453
Sometimes the best evidence is on page three.
