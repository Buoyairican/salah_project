<html lang="fr">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des affectations - RST</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- [V2] Interface de gestion (coordination). Les données nominatives ne viennent que des fonctions admin*,
       qui revérifient l'adresse de l'appelant côté serveur. -->
  <style>

    .is-hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }
    .loader {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #1d4ed8;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .loader-lg { width: 36px; height: 36px; border-width: 4px; }
    .loader-light { border-color: rgba(255,255,255,.35); border-top-color: #fff; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    .anim-fade { animation: fadeIn .15s ease-out; }
    .anim-pop { animation: popIn .18s ease-out; }
    .anim-slide { animation: slideIn .2s ease-out; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    select[aria-invalid="true"], input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: #f87171; background-color: #fef2f2; }
    .tbl th { position: sticky; top: 0; z-index: 1; }
    .row-link { cursor: pointer; }
    .row-link:focus-visible { outline: 2px solid #1d4ed8; outline-offset: -2px; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    @media (prefers-reduced-motion: reduce) { .anim-fade, .anim-pop, .anim-slide, .loader { animation: none; } }
  </style>
</head>

  <div id="mockBanner" class="is-hidden border-b border-amber-200 bg-amber-50 px-4 py-2 text-xs text-amber-900"></div>

        <div class="min-w-0">

        </div>
        <span class="hidden md:inline-flex ml-1 items-center rounded-full bg-white/10 px-2.5 py-0.5 text-xs font-medium text-sky-100 ring-1 ring-white/15">Espace coordination</span>
      </div>
      <div class="flex items-center gap-2 sm:gap-4">
        <div class="hidden sm:flex items-center gap-2 text-xs text-slate-300">
          <span id="syncDot" class="inline-block w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="syncText" class="tabular">Chargement…</span>
        </div>
        <button type="button" id="refreshBtn" class="inline-flex items-center gap-1.5 rounded-lg bg-white/10 hover:bg-white/20 px-3 py-1.5 text-sm font-medium ring-1 ring-white/15 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" aria-label="Actualiser les données"></button>
        <div id="userChip" class="is-hidden hidden lg:flex items-center gap-2 pl-3 border-l border-white/15">
          <span id="userInitials" class="w-8 h-8 rounded-full bg-sky-400/25 ring-1 ring-sky-300/40 flex items-center justify-center text-xs font-semibold text-sky-100"></span>
          <span id="userEmail" class="text-sm text-slate-200 max-w-[230px] truncate"></span>
        </div>
      </div>
    </div>
  </header>

    <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex items-center gap-3">
      <span class="hidden sm:inline text-[11px] font-semibold uppercase tracking-wider text-slate-400 shrink-0">Campagne</span>
      <ol id="phaseList" class="relative flex items-center gap-1.5 overflow-x-auto no-scrollbar"></ol>
    </div>
  </div>

  <!-- Navigation mobile -->
  <nav id="mobileNav" class="is-hidden lg:hidden sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200" aria-label="Sections">
    <div id="mobileNavList" class="relative flex gap-1 overflow-x-auto no-scrollbar px-3 py-2"></div>
  </nav>

  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:flex lg:gap-8">
    <!-- Navigation latérale -->
    <aside id="sideNav" class="is-hidden hidden lg:block w-64 shrink-0">
      <div class="sticky top-6 space-y-6">
        <nav id="sideNavList" class="space-y-1" aria-label="Sections"></nav>
        <div id="sideLinks" class="rounded-xl border border-slate-200 bg-white p-4 text-sm"></div>
      </div>
    </aside>

    <main id="main" class="flex-1 min-w-0">
      <!-- Chargement initial / erreur -->
      <section id="bootView" class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">

          <div class="loader loader-lg mb-4"></div>
          <p class="text-slate-600 text-sm">Chargement de l'espace de gestion…</p>
        </div>
        <div id="bootError" class="is-hidden py-2">

          <p id="bootErrorText" class="mt-2 text-sm text-slate-600 break-words"></p>

        </div>
      </section>
      <div id="view"></div>
    </main>
  </div>

    function timelineChart(points, classSize, unit) {
      var W = 640, H = 230, L = 34, R = 14, T = 14, B = 30;
      var n = points.length;
      var maxY = Math.max(classSize || 1, points[n - 1].cumulative, 1);
      var x = function (i) { return L + (n <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); };
      var y = function (v) { return T + (H - T - B) * (1 - v / maxY); };
      var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, 'class': 'w-full h-auto', role: 'img', 'aria-label': 'Évolution du nombre d’étudiants ayant enregistré leurs choix' });
      [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
        var v = Math.round(maxY * f), yy = y(v);
        root.appendChild(svg('line', { x1: L, x2: W - R, y1: yy, y2: yy, stroke: '#e2e8f0', 'stroke-width': 1 }));
        root.appendChild(svg('text', { x: L - 8, y: yy + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#94a3b8' }, String(v)));
      });
      var bw = Math.max(3, Math.min(16, (W - L - R) / Math.max(n, 1) * 0.55));
      points.forEach(function (pt, i) {
        if (!pt.added) return;
        root.appendChild(svg('rect', { x: x(i) - bw / 2, y: y(pt.added), width: bw, height: Math.max(1, y(0) - y(pt.added)), rx: 2, fill: '#bfdbfe' }));
      });
      var line = points.map(function (pt, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(pt.cumulative).toFixed(1); }).join(' ');
      root.appendChild(svg('path', { d: line + ' L' + x(n - 1).toFixed(1) + ' ' + y(0) + ' L' + x(0).toFixed(1) + ' ' + y(0) + ' Z', fill: '#1d4ed8', 'fill-opacity': 0.07 }));
      root.appendChild(svg('path', { d: line, fill: 'none', stroke: '#1d4ed8', 'stroke-width': 2.25, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      points.forEach(function (pt, i) {
        var label = (unit === 'hour' ? fmtHour(pt.t) : fmtDay(pt.t)) + ' : +' + pt.added + ' (total ' + pt.cumulative + ')';
        root.appendChild(svg('circle', { cx: x(i), cy: y(pt.cumulative), r: n > 40 ? 2 : 3.5, fill: '#fff', stroke: '#1d4ed8', 'stroke-width': 2 }, svg('title', {}, label)));
      });
      if (classSize) {
        root.appendChild(svg('line', { x1: L, x2: W - R, y1: y(classSize), y2: y(classSize), stroke: '#64748b', 'stroke-width': 1, 'stroke-dasharray': '4 4' }));
        root.appendChild(svg('text', { x: W - R, y: y(classSize) - 5, 'text-anchor': 'end', 'font-size': 11, fill: '#64748b' }, 'Effectif : ' + classSize));
      }
      var idx = n === 1 ? [0] : (n === 2 ? [0, 1] : [0, Math.floor((n - 1) / 2), n - 1]);
      idx.forEach(function (i, k) {
        root.appendChild(svg('text', { x: x(i), y: H - 8, 'text-anchor': n === 1 ? 'middle' : (k === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')), 'font-size': 11, fill: '#64748b' }, unit === 'hour' ? fmtHour(points[i].t) : fmtDay(points[i].t)));
      });
      return root;
    }

    // =====================================================================

    function viewWhatIf() {
      var c = ov.config, N = ov.participation.classSize, w = ui.whatif;
      if (w.max === null) { w.max = c.rules.max; w.min = c.rules.min; }
      var maxIn = h('input', { type: 'number', min: '1', max: '999', step: '1', value: String(w.max), class: inputCls('text-2xl font-semibold tabular h-14'), id: 'wiMax' });
      var minIn = h('input', { type: 'number', min: '0', max: '999', step: '1', value: String(w.min), class: inputCls('tabular'), id: 'wiMin' });
      var derived = h('div');
      function readInputs() {
        w.max = maxIn.value === '' ? '' : Number(maxIn.value);
        w.min = minIn.value === '' ? '' : Number(minIn.value);
        drawDerived();
      }
      function drawDerived() {
        clear(derived);
        var mx = Number(w.max), mn = Number(w.min);
        var valid = isFinite(mx) && isFinite(mn) && w.max !== '' && w.min !== '' && mn >= 0 && mn <= mx && Math.floor(mx) === mx && Math.floor(mn) === mn;
        var checks = valid ? [
          { ok: 3 * mx >= N, text: '3 × ' + mx + ' = ' + (3 * mx) + ' places ' + (3 * mx >= N ? '≥ ' : '< ') + N + ' étudiants' },
          { ok: 3 * mn <= N, text: '3 × ' + mn + ' = ' + (3 * mn) + (3 * mn <= N ? ' ≤ ' : ' > ') + N + ' étudiants' }
        ] : [{ ok: false, text: 'Saisissez des entiers avec 0 ≤ minimum ≤ maximum.' }];
        var floor = valid ? Math.max(mn, N - 2 * mx) : null;
        add(derived, [
          h('div', { class: 'rounded-lg bg-slate-50 border border-slate-200 p-4' }, [
            h('div', { class: 'text-xs font-medium text-slate-500', text: 'Plancher garanti par filière' }),
            h('div', { class: 'mt-0.5 text-2xl font-semibold tabular text-slate-900', text: floor === null ? '—' : String(floor) }),
            h('div', { class: 'text-xs text-slate-500', text: 'max(minimum, ' + N + ' − 2 × plafond)' }),
            valid && N - 2 * mx >= mn ? h('p', { class: 'mt-2 text-xs text-slate-600', text: 'Le minimum n’est pas contraignant avec ce plafond : il ne jouerait qu’avec un plafond d’environ ' + Math.ceil((N - mn) / 2 + 1) + ' ou plus.' }) : null
          ]),
          h('ul', { class: 'mt-3 space-y-1.5' }, checks.map(function (x) {
            return h('li', { class: 'flex items-center gap-2 text-sm ' + (x.ok ? 'text-emerald-700' : 'text-red-700') }, [icon(x.ok ? 'checkCircle' : 'warning', 'w-4 h-4 shrink-0'), x.text]);
          }))
        ]);
      }
      maxIn.addEventListener('input', readInputs);
      minIn.addEventListener('input', readInputs);
      drawDerived();
      function run() {
        if (w.loading) return;
        w.loading = true; w.error = null;
        renderTab();
        rpc('adminWhatIf', [{ min: w.min, max: w.max }], function (res) { w.loading = false; w.result = res; renderTab(); },
          function (err) { w.loading = false; w.error = errMsg(err); renderTab(); });
      }
      var presets = h('div', { class: 'flex flex-wrap gap-2' }, [

    function whatIfResults(res) {

      var rows = branches().map(function (b) {

              confirmAction({
                title: 'Appliquer plafond ' + res.rules.max + ' et minimum ' + res.rules.min + ' ?',
                intro: 'L’affectation provisoire et les projections des étudiants seront recalculées immédiatement (à leur prochaine actualisation). ' + plural(res.changed.length, 'étudiant change', 'étudiants changent') + ' de filière.',

    function viewResults() {
      var c = ov.config, res = c.results, pend = ov.participation.pending, ties = ov.allocation.unresolvedTies;
      var pub = res.published;
      var step = function (n, title, done, content, active) {
        return h('div', { class: 'relative rounded-xl border bg-white p-5 shadow-sm min-w-0 ' + (active ? 'border-blue-300 ring-1 ring-blue-200' : 'border-slate-200') }, [
          h('div', { class: 'flex items-center gap-3 mb-3' }, [
            h('span', { class: 'w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-sm font-semibold ' + (done ? 'bg-emerald-600 text-white' : active ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-500') }, done ? icon('check', 'w-4 h-4') : String(n)),
            h('h2', { class: 'text-[15px] font-semibold text-slate-900', text: title })
          ]),
          content
        ]);
      };

      // 1. Clore
      var s1 = h('div', { class: 'space-y-3 text-sm' }, [
        h('p', { class: 'text-slate-600', text: c.locked ? 'Choix ' + lockLabel().toLowerCase() + '.' : 'Les choix sont encore ouverts.' }),
        !c.locked ? btn('Clore les choix', { variant: 'danger', icon: 'lock', size: 'sm', disabled: !!busy, onClick: function () {

        } }) : null
      ]);

      // 2. Figer
      var ack = ui.freezeAck;
      var needs = [];
      if (!c.locked) needs.push({ k: 'notLocked', text: 'Les choix ne sont pas clos : figer quand même.' });
      if (pend) needs.push({ k: 'pending', text: plural(pend, 'étudiant sans choix', 'étudiants sans choix') + ' (' + (c.undecidedPolicy === 'LAST' ? 'placés automatiquement' : 'non placés') + ').' });

          var e = String(email || '').toLowerCase().trim();
          if (!e) throw new Error('Saisissez une adresse à tester.');
          var byEmail = students.filter(function (x) { return x.email === e; }).map(function (x) { return x.name; });
          var out = { email: e, isAdmin: e === ADMIN, domainOk: /@uit\.ac\.ma$/.test(e) };
          if (byEmail.length) { out.verdict = byEmail.length === 1 ? 'OK' : 'AMBIGUOUS'; out.via = 'EMAIL_COLUMN'; out.matches = byEmail; return out; }
          var pieces = e.split('@')[0].split('.').map(squash).filter(function (p) { return p; });
          var m = pieces.length ? students.filter(function (x) { return !x.email && pieces.every(function (p) { return squash(x.name).indexOf(p) !== -1; }); }).map(function (x) { return x.name; }) : [];
          out.verdict = m.length === 1 ? 'OK' : m.length ? 'AMBIGUOUS' : 'NONE'; out.via = 'NAME_PIECES'; out.matches = m;
          return out;
        },
        adminPreviewReminders: function () {
          var pend = students.filter(function (x) { return !x.choices; });
          var filled = students.filter(function (x) { return x.email; }).length;
          return copy({
            recipients: pend.filter(function (x) { return x.email; }).map(function (x) { return { name: x.name, email: x.email }; }),
            missingEmail: pend.filter(function (x) { return !x.email; }).map(function (x) { return x.name; }),
            remainingQuota: db.quota, available: filled > 0 && db.quota > 0, reason: filled ? null : 'Renseignez la colonne C « Email » de la feuille Responses pour envoyer des rappels.',
            defaultSubject: 'Rappel : classez vos filières de spécialité (CI2 RST)',
            defaultBody: 'Bonjour {nom},\n\nVous n\'avez pas encore enregistré votre classement des filières de spécialité (' + BR.join(', ') + ').\n\nDate limite : {date_limite}\nLien : {lien}\n\nConnectez-vous avec votre compte @uit.ac.ma, classez les trois filières, puis appuyez sur « Enregistrer mes choix ».\n\nCordialement,\nLa coordination CI2 RST'
          });
        },
        adminSetDeadline: function (local, unlock) {
          var ms = null;
          if (local) { ms = localToMs(String(local).trim()); if (ms === null) throw new Error("Date limite invalide : format attendu AAAA-MM-JJ HH:mm (heure de l'établissement)."); }
          var newManual = unlock ? false : db.manualLock, passed = ms !== null && Date.now() >= ms;
          if (db.published && !newManual && !passed) throw new Error("Dépubliez d'abord les résultats.");
          db.deadline = ms; if (unlock) db.manualLock = false;
          var open = !newManual && !passed;
          return write('DATE_LIMITE', (local ? 'Date limite : ' + local + ' (' + TZ + ')' : 'Date limite supprimée') + (unlock ? ' ; verrou manuel levé' : ''),
            (local ? 'Date limite fixée au ' + fmtLong(iso(ms)).replace(/^\w/, function (c) { return c.toLowerCase(); }) + '.' : 'Date limite supprimée.') + (unlock ? ' Verrou manuel levé.' : '') + (open ? ' Les choix sont ouverts.' : ' Les choix sont clos.'));
        },
        adminSetLocked: function (b) {
          if (!b && db.published) throw new Error("Dépubliez d'abord les résultats.");
          db.manualLock = !!b;
          var passed = db.deadline !== null && Date.now() >= db.deadline;
          return write('VERROU', b ? 'Verrou manuel activé' : 'Verrou manuel levé', b ? "Choix clos : plus aucun enregistrement étudiant n'est accepté." : (passed ? 'Verrou manuel levé, mais la date limite est dépassée : les choix restent clos. Repoussez la date limite pour les rouvrir.' : 'Choix rouverts : les étudiants peuvent de nouveau enregistrer.'));
        },
        adminSetStudentPageOpen: function (b) {
          db.pageOpen = !!b; unstale(['STUDENT_PAGE_OPEN']);
          return write('PAGE_ETUDIANTE', b ? 'Page étudiante ouverte' : 'Page étudiante fermée', b ? 'Page étudiante ouverte : les étudiants voient désormais le tableau de bord.' : "Page étudiante fermée : les étudiants voient la page d'attente.");
        },
        adminSetUndecidedPolicy: function (p) {
          if (p !== 'LAST' && p !== 'MANUAL') throw new Error('Politique inconnue : choisissez LAST ou MANUAL.');
          db.policy = p; unstale(['UNDECIDED_POLICY']);
          return write('POLITIQUE_SANS_CHOIX', 'Politique sans choix : ' + p, p === 'LAST' ? 'Les étudiants sans choix seront placés en dernier, dans les filières qui en ont le plus besoin.' : "Les étudiants sans choix resteront non placés jusqu'à une décision manuelle.");
        },
        adminSetRules: function (o) {
          var min = Number(o.min), max = Number(o.max), N = students.length;
          if (3 * max < N) throw new Error('Plafond insuffisant : 3 × ' + max + ' = ' + (3 * max) + ' places pour ' + N + ' étudiants.');
          if (3 * min > N) throw new Error('Minimum impossible : 3 × ' + min + ' = ' + (3 * min) + " dépasse l'effectif de " + N + '.');
          var before = db.min + ' / ' + db.max;
          db.min = min; db.max = max; unstale(['MIN_SEATS', 'MAX_SEATS']);
          return write('REGLES', 'Minimum et maximum : ' + before + ' → ' + min + ' / ' + max, 'Règles appliquées : au plus ' + max + ' et au moins ' + min + ' étudiants par filière. Les projections des étudiants changeront à leur prochaine actualisation.');
        },
        adminSetAnnouncement: function (o) {
          if (!o || !String(o.text || '').trim()) { db.announcement = null; return write('ANNONCE', 'Annonce retirée', 'Annonce retirée.'); }
          if (String(o.text).length > 400) throw new Error("L'annonce ne doit pas dépasser 400 caractères.");
          db.announcement = { text: String(o.text).trim(), level: o.level === 'warning' ? 'warning' : 'info', updatedAt: iso(Date.now()) };
          return write('ANNONCE', '[' + db.announcement.level + '] ' + db.announcement.text, 'Annonce publiée : elle apparaît sur la page des étudiants.');
        },
        adminSaveTieBreak: function (o) {
          var r = reason(o.reason), members = students.filter(function (x) { return x.grade === o.grade; }).map(function (x) { return x.name; });
          if (members.length < 2) throw new Error('Aucune égalité à la note ' + fmtG(o.grade) + '.');
          if (o.order.length !== members.length || members.some(function (m) { return o.order.indexOf(m) === -1; })) throw new Error("L'ordre doit contenir exactement les " + members.length + ' étudiants à égalité (la liste a peut-être changé : actualisez).');
          db.ties[String(o.grade)] = { order: o.order.slice(), reason: r, by: ADMIN, at: iso(Date.now()) };
          return write('DEPARTAGE', 'Note ' + fmtG(o.grade) + ' : ' + o.order.join(' > ') + ' — raison : ' + r, 'Départage enregistré pour la note ' + fmtG(o.grade) + '.');
        },
        adminClearTieBreak: function (g) {
          if (!db.ties[String(g)]) throw new Error('Aucun départage enregistré pour la note ' + fmtG(g) + '.');
          delete db.ties[String(g)];
          return write('DEPARTAGE_SUPPRIME', 'Note ' + fmtG(g), 'Départage supprimé pour la note ' + fmtG(g) + " : retour à l'ordre alphabétique.");
        },
        adminSetChoicesFor: function (o) {
          var r = reason(o.reason); notPublished();
          var k = need(o.name), x = students[k];
          if (!Array.isArray(o.choices) || o.choices.length !== 3 || o.choices.some(function (b, i) { return BR.indexOf(b) === -1 || o.choices.indexOf(b) !== i; })) throw new Error('Classez les 3 filières (' + BR.join(', ') + '), chacune une seule fois.');
          if (same(x.choices, o.choices)) return write('CHOIX_ADMIN', null, 'Les choix de ' + x.name + " sont déjà ceux-ci : rien n'a changé.");
          var before = x.choices ? x.choices.join(' > ') : 'aucun choix';
          x.choices = o.choices.slice(); x.savedAt = Date.now();
          history.push({ at: x.savedAt, name: x.name, choices: x.choices.slice(), source: 'ADMIN', author: ADMIN });
          return write('CHOIX_ADMIN', x.name + ' : ' + before + ' → ' + x.choices.join(' > ') + ' — raison : ' + r, 'Choix de ' + x.name + ' enregistrés : ' + x.choices.join(' > ') + '.');
        },
        adminForceAssign: function (o) {
          var r = reason(o.reason); notPublished();
          var k = need(o.name), x = students[k], cur = db.forced[x.name];
          if (!o.branch && !cur) throw new Error(x.name + " n'a pas d'affectation imposée.");
          if (o.branch) {
            var others = Object.keys(db.forced).filter(function (n) { return n !== x.name && db.forced[n].branch === o.branch; }).length;
            if (others >= db.max) throw new Error('Impossible : ' + o.branch + ' compte déjà ' + others + ' affectations imposées (plafond ' + db.max + ').');
            db.forced[x.name] = { branch: o.branch, reason: r, by: ADMIN, at: iso(Date.now()) };
          } else delete db.forced[x.name];
          return write('AFFECTATION_IMPOSEE', x.name + ' : ' + (cur ? cur.branch : 'aucune') + ' → ' + (o.branch || 'aucune') + ' — raison : ' + r,
            o.branch ? x.name + " est désormais affecté(e) d'office à " + o.branch + '.' : 'Affectation imposée retirée pour ' + x.name + '.');
        },
        adminFreezeAllocation: function (o) {
          var ack = (o && o.ack) || {}, a = allocate(), L = lockInfo(), pend = students.filter(function (x) { return !x.choices; }).length;
          if (!L.locked && !ack.notLocked) throw new Error('Les choix ne sont pas clos : confirmez que vous voulez figer quand même.');
          if (pend && !ack.pending) throw new Error(pend + ' étudiant(s) sans choix : confirmez que vous voulez figer quand même.');
          if (a.unresolvedTies && !ack.ties) throw new Error(a.unresolvedTies + ' égalité(s) décisive(s) non départagée(s) : confirmez que vous voulez figer quand même.');
          var sheet = 'Affectation_' + msToLocal(Date.now()).replace(/-/g, '').replace(' ', '_').replace(':', '');
          if (db.frozen.some(function (f) { return f.sheet === sheet; })) throw new Error('Une affectation a déjà été figée à cette minute (' + sheet + ') : réessayez dans une minute.');
          db.frozen.unshift({ sheet: sheet, at: iso(Date.now()), by: ADMIN, exists: true, snapshot: snapshotOf(a) });
          db.frozen = db.frozen.slice(0, 10);
          return write('FIGER', sheet + ' — ' + BR.map(function (b) { return b + ' ' + a.counts[b]; }).join(', '), 'Affectation figée dans la feuille « ' + sheet + ' ».', { sheet: sheet });
        },
        adminPublishResults: function (o) {
          if (!o || o.confirm !== 'PUBLIER') throw new Error('Tapez PUBLIER pour confirmer la publication.');
          if (!lockInfo().baseLocked) throw new Error("Clôturez d'abord les choix (verrou ou date limite dépassée) avant de publier.");
          if (!db.frozen.some(function (f) { return f.sheet === o.sheet; })) throw new Error('Cette feuille ne fait pas partie des affectations figées.');
          db.published = { sheet: o.sheet, at: iso(Date.now()), by: ADMIN };
          return write('PUBLIER', 'Feuille publiée : ' + o.sheet, 'Résultats publiés : chaque étudiant voit désormais sa filière officielle.');
        },
        adminUnpublishResults: function () {
          if (!db.published) throw new Error("Aucun résultat n'est publié.");
          var s = db.published.sheet; db.published = null;
          return write('DEPUBLIER', 'Feuille dépubliée : ' + s, 'Résultats dépubliés : les étudiants ne voient plus de résultat officiel.');
        },
        adminCleanSettings: function () {
          var keys = db.staleProps.slice();
          if (!keys.length) return write('REGLAGES_NETTOYES', null, 'Aucune propriété inutile : rien à retirer.');
          db.staleProps = [];
          return write('REGLAGES_NETTOYES', 'Propriétés retirées (valeur par défaut ou vide) : ' + keys.join(', '), keys.length + ' propriété(s) inutile(s) retirée(s) : ' + keys.join(', ') + '.');
        },
        adminSendReminders: function (o) {
          if (!o || o.confirm !== 'ENVOYER') throw new Error("Tapez ENVOYER pour confirmer l'envoi.");
          if (lockInfo().locked) throw new Error('Les choix sont clos : un rappel inviterait les étudiants à une action impossible.');
          var targets = students.filter(function (x) { return !x.choices && x.email; });
          var results = targets.map(function (x) {
            if (db.quota <= 0) return { name: x.name, email: x.email, status: 'SKIPPED', error: 'Quota quotidien atteint' };
            db.quota--; return { name: x.name, email: x.email, status: 'SENT', error: null };
          });
          var sent = results.filter(function (r) { return r.status === 'SENT'; }).length, skipped = results.length - sent;
          return write('RAPPELS', sent + ' envoyé(s), 0 échec(s), ' + skipped + ' non envoyé(s) (quota) — objet : ' + o.subject, sent + ' rappel(s) envoyé(s)' + (skipped ? ', ' + skipped + ' non envoyé(s) faute de quota' : '') + '.', { results: results, sent: sent, failed: 0, skipped: skipped });
        }
      };

      // Bandeau du mode démo, avec des liens vers chaque scénario
      var banner = $('mockBanner');
      add(banner, [h('strong', { class: 'font-semibold', text: 'Mode démo' }), ' — google.script.run est absent : données fictives, rien n’est enregistré. Scénarios : ']);
      [['Campagne en cours', '?scenario=campagne'], ['Préparation', '?scenario=preparation'], ['Choix clos', '?scenario=cloture'], ['Résultats publiés', '?scenario=publie'], ['Anomalies', '?scenario=anomalies'], ['Erreur d’écriture', '?scenario=campagne&fail=action']]
        .forEach(function (s, i) {
          if (i) banner.appendChild(document.createTextNode(' · '));
          banner.appendChild(h('a', { href: s[1], class: 'underline ' + (location.search.indexOf(s[1].slice(1)) !== -1 ? 'font-semibold' : ''), text: s[0] }));
        });
      show(banner, true);

      return {
        pollMs: pollSec > 0 ? pollSec * 1000 : 0,
        run: function (onOk, onFail) {
          var runner = {};
          Object.keys(api).forEach(function (fn) {
            runner[fn] = function () {
              var args = Array.prototype.slice.call(arguments).map(function (a) { return a === undefined ? a : copy(a); });
              setTimeout(function () {
                var out;
                try { out = copy(api[fn].apply(null, args)); } catch (e) { onFail(e); return; }
                onOk(out);
              }, delay);
            };
          });
          return runner;
        }
      };
    }

    // =====================================================================
    // Démarrage
    // =====================================================================
    $('brandIcon').appendChild(icon('cap', 'w-6 h-6'));
    add($('refreshBtn'), [icon('refresh', 'w-4 h-4'), h('span', { class: 'hidden sm:inline', text: 'Actualiser' })]);
    $('refreshBtn').addEventListener('click', function () {
      load('manual');
      if (tab === 'journal') loadJournal(ui.journal.offset);
      if (tab === 'reminders') loadReminders();
    });
    $('bootRetryBtn').addEventListener('click', function () { load('load'); });
    setInterval(function () {
      syncChrome();
      tickers.forEach(function (f) { try { f(); } catch (e) { /* rien */ } });
    }, 1000);
    syncChrome();
    load('load');
  })();
  </script>
</body>
</html>
